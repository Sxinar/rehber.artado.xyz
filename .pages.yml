# PagesCMS Configuration for Jekyll Chirpy Theme
media:
  input: assets/img # Chirpy görselleri genellikle buraya yüklenir
  output: /assets/img

collections:
  # ==========================================
  # 1. BLOG YAZILARI (POSTS)
  # ==========================================
  - id: posts
    label: Yazılar (Posts)
    description: Blog yazılarınızı buradan ekleyebilir ve düzenleyebilirsiniz.
    type: collection
    path: _posts
    format: json-frontmatter # Chirpy genellikle YAML front matter kullanır, markdown formatında saklar
    filename: '{year}-{month}-{day}-{slug}.md'
    fields:
      - id: title
        label: Başlık
        type: string
        required: true
      - id: date
        label: Yayınlanma Tarihi
        type: datetime
        required: true
      - id: description
        label: Kısa Açıklama (Snippet)
        type: string
        description: Arama sonuçlarında ve ana sayfada görünecek kısa özet.
      - id: categories
        label: Kategoriler
        type: list
        description: En fazla 2 seviye (örn. [Teknoloji, Yapay Zeka])
        field:
          type: string
      - id: tags
        label: Etiketler
        type: list
        field:
          type: string
      - id: image
        label: Öne Çıkan Görsel
        type: object
        fields:
          - id: path
            label: Görsel Yolu
            type: image
          - id: alt
            label: Alternatif (Alt) Metin
            type: string
          - id: lqip
            label: LQIP (Düşük Kaliteli Önizleme - Base64)
            type: string
            description: 'İsteğe bağlı: blur efekti için'
      - id: pin
        label: Ana Sayfaya Sabitle
        type: boolean
        default: false
      - id: toc
        label: İçindekiler Tablosunu Göster (TOC)
        type: boolean
        default: true
      - id: comments
        label: Yorumları Aktif Et
        type: boolean
        default: true
      - id: math
        label: Matematik Formülleri (MathJax)
        type: boolean
        default: false
      - id: mermaid
        label: Diyagramlar (Mermaid.js)
        type: boolean
        default: false
      - id: body
        label: Yazı İçeriği
        type: markdown
        required: true

  # ==========================================
  # 2. SABİT SAYFALAR (PAGES)
  # ==========================================
  - id: pages
    label: Sayfalar (Pages)
    description: Hakkımda, İletişim gibi sabit sayfalar.
    type: collection
    path: /
    files: '*.md'
    fields:
      - id: title
        label: Sayfa Başlığı
        type: string
        required: true
      - id: layout
        label: Şablon (Layout)
        type: choice
        default: page
        choices:
          - { label: 'Standart Sayfa', value: 'page' }
          - { label: 'Arşiv', value: 'archives' }
          - { label: 'Kategoriler', value: 'categories' }
          - { label: 'Etiketler', value: 'tags' }
          - { label: 'Ana Sayfa', value: 'home' }
      - id: permalink
        label: Kalıcı Bağlantı (URL)
        type: string
        required: true
        description: 'Örn: /about/ veya /contact/'
      - id: description
        label: Sayfa Açıklaması (SEO)
        type: string
      - id: body
        label: Sayfa İçeriği
        type: markdown
        required: true

  # ==========================================
  # 3. CHIRPY TEMA AYARLARI (CONFIG)
  # ==========================================
  - id: settings
    label: Site ve Tema Ayarları
    type: files
    files:
      - id: config
        label: Genel Ayarlar (_config.yml)
        path: _config.yml
        format: yaml
        fields:
          - id: title
            label: Site Adı
            type: string
          - id: tagline
            label: Site Sloganı
            type: string
          - id: description
            label: Site Açıklaması (SEO)
            type: string
          - id: url
            label: Site URL (https://...)
            type: string
          - id: author
            label: Yazar Adı
            type: string
          - id: avatar
            label: Profil Resmi (Avatar URL)
            type: string
          - id: timezone
            label: Zaman Dilimi
            type: string
            description: 'Örn: Europe/Istanbul'
          - id: lang
            label: Site Dili
            type: string
            default: tr
          - id: theme_mode
            label: Tema Modu
            type: choice
            default: light
            choices:
              - { label: 'Açık Mod (Light)', value: 'light' }
              - { label: 'Koyu Mod (Dark)', value: 'dark' }

      - id: navigation
        label: Yan Menü Sosyal Linkleri (_data/share.yml vb.)
        path: _data/contact.yml
        format: yaml
        fields:
          - id: email
            label: E-posta Adresi
            type: string
          - id: twitter
            label: Twitter Kullanıcı Adı
            type: string
          - id: github
            label: GitHub Kullanıcı Adı
            type: string